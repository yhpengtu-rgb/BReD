seed: 17
device: "cuda:0"
output: "results/stage2/scene0523_rogs_wolidar_6ep"

dataset:
  dataset: "NuscDataset"
  version: "trainval"
  base_dir: "assets/datasets/nuScenes"
  image_dir: "assets/datasets/nuScenes_clip"
  road_gt_dir: "assets/datasets/nuScenes_road_gt"
  replace_name: False
  clip_list:
    - "scene-0523"
  min_distance: 0.2
  image_width: 800
  image_height: 450
  camera_names:
    - "CAM_FRONT"
    - "CAM_FRONT_LEFT"
    - "CAM_FRONT_RIGHT"
    - "CAM_BACK"
    - "CAM_BACK_LEFT"
    - "CAM_BACK_RIGHT"

train:
  vis: False
  debug_from: -1
  detect_anomaly: False
  start_checkpoint: ""
  eval: True
  save: True

model:
  bev_resolution: 0.05
  cut_range: 8
  sh_degree: 3
  use_rgb: True
  use_label: True
  opt_xy: False
  white_background: False
  use_exposure: True
  v10a1_elevation_dir: "assets/cache/elevation_export"
  v10a1_cache_dir: "assets/cache/elevation_fusion"
  v10a1_source_cell_m: 0.4
  v10a1_expected_frames: 391
  v10a1_query_workers: 16
  v11a2_rgb_cache_dir: "assets/cache/rgbz"
  v11a2_rgb_median_chunk: 4096
  v11a4_geometry_export_dir: "assets/cache/geometry_export"
  v11a4_geometry_cache_dir: "assets/cache/geometry_97ch_bev"
  v11a4_geometry_source_cell_m: 0.8
  v11a4_geometry_expected_frames: 391
  v11a4_geometry_query_workers: 16
  gifsplat_residual:
    enabled: True
    steps: 2
    branch_dim: 32
    geometric_prior_dim: 97
    residual_lr: 0.001
    z_delta_scale: 0.05
    scaling_delta_scale: 0.1
    rotation_delta_scale: 0.1
    opacity_delta_scale: 1.0
    rgb_delta_scale: 1.0
    label_delta_scale: 1.0

optimization:
  epochs: 6
  random_background: False
  position_lr_init: 0.000016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  percent_dense: 0.01
  feature_lr: 0.0005
  opacity_lr: 0.0001
  scaling_lr: 0.0001
  rotation_lr: 0.0001
  rgb_lr: 0.008
  label_lr: 0.1
  exposure_lr: 0.001
  seg_loss_weight: 0.06
  smooth_loss_weight: 0.003
  depth_loss_weight: 0
  z_weight: 0

pipeline:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
